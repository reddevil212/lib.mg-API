spring.application.name=main

# Render dynamically sets $PORT (defaults to 8080 locally)
server.port=${PORT:8080}

# Database Configuration (Overrides via environment variables in production)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db.mlucfxchsvzccpzgoxkz.supabase.co:5432/postgres?reRewriteBatchedInserts=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:LibManage@123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# JWT Configuration
jwt.secret=${JWT_SECRET:MySecretKeyForJwtSigningMustBeAtLeast32BytesLongForHS256Security!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

